<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotiGlass - Desktop Spotify Widget (BETA)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
</head>
<body>
  <div id="scalable-wrapper" class="scalable-wrapper">
    <div class="widget-container">
      <!-- Ambiente Brillante & Ondas Expansivas -->
      <div id="ambient-glow" class="ambient-glow"></div>
      <div id="wave-emitter" class="wave-emitter">
        <div class="sound-wave wave-1"></div>
        <div class="sound-wave wave-2"></div>
        <div class="sound-wave wave-3"></div>
      </div>

      <!-- Encabezado de la Ventana -->
      <div class="window-header">
        <div class="app-title">
          <img src="icon.png" width="13" height="13" alt="Logo">
          SpotiGlass <span class="beta-badge">BETA v1.0.0</span>
        </div>
        <div class="window-controls">
          <button id="dock-btn" class="control-btn icon-btn" title="Acoplar a la Barra de Tareas">📌</button>
          <button id="search-btn" class="control-btn icon-btn" title="Buscar Canción">🔍</button>
          <button id="lyrics-btn" class="control-btn icon-btn" title="Activar/Desactivar Letra">🎤</button>
          <button id="minimize-btn" class="control-btn minimize" title="Minimizar"></button>
          <button id="close-btn" class="control-btn close" title="Cerrar"></button>
        </div>
      </div>

      <!-- Sección Principal del Reproductor -->
      <div class="content-section">
        <div id="album-wrapper" class="album-wrapper">
          <div class="album-container">
            <img id="album-art" class="album-art hidden" src="" alt="Album Cover" crossorigin="anonymous">
            <div id="album-placeholder" class="album-placeholder">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 8v4l3 3"></path>
              </svg>
            </div>
          </div>
        </div>

        <div class="player-body">
          <div class="track-details">
            <div id="track-title" class="track-title">Esperando Spotify...</div>
            <div id="artist-name" class="artist-name">Inicia sesión o reproduce una canción</div>
          </div>

          <div class="controls-and-visualizer">
            <div class="playback-btns">
              <button id="prev-btn" class="action-btn" title="Anterior">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
                </svg>
              </button>
              <button id="play-pause-btn" class="action-btn play-pause" title="Play/Pause">
                <svg id="play-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6 3 20 12 6 21 6 3"></polygon>
                </svg>
                <svg id="pause-icon" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                  <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
              </button>
              <button id="next-btn" class="action-btn" title="Siguiente">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
                </svg>
              </button>
            </div>

            <!-- Animación de Lottie Player de Personajes -->
            <dotlottie-player id="duck-lottie" src="duck.json" background="transparent" speed="1" loop autoplay></dotlottie-player>

            <!-- Reemplazo Directo de Letra Explosiva Sincronizada -->
            <div id="lyrics-inline-container" class="lyrics-inline-container hidden">
              <div id="explosive-paragraph" class="explosive-paragraph">
                🎤 Cargando letra...
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal de Búsqueda de Canciones -->
      <div id="search-modal" class="setup-modal hidden">
        <div class="setup-header">
          <div class="setup-title">🔍 Buscar Canción</div>
          <button id="close-search-btn" class="lyrics-close-btn">&times;</button>
        </div>
        <div class="form-group">
          <input type="text" id="search-input" class="input-field" placeholder="Escribe canción o artista..." autocomplete="off">
        </div>
        <div id="search-results-list" class="search-results-list">
          <div class="search-empty">Escribe arriba para buscar en Spotify</div>
        </div>
      </div>

      <!-- Modal de Inicio de Sesión Limpio -->
      <div id="setup-modal" class="setup-modal setup-modal-clean hidden">
        <div class="setup-title">🎵 SpotiGlass <span class="beta-tag-modal">BETA</span></div>
        <div class="login-desc">Inicia sesión en Spotify con 1 solo clic para controlar tu música desde el escritorio.</div>
        <button id="login-spotify-btn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.341c-.218.359-.696.475-1.055.257-2.887-1.765-6.523-2.164-10.808-1.185-.407.094-.814-.161-.908-.567-.094-.407.161-.814.567-.908 4.693-1.072 8.715-.615 11.947 1.358.359.218.475.696.257 1.045zm1.473-3.277c-.274.446-.86.588-1.306.314-3.302-2.03-8.337-2.617-12.244-1.43-.497.151-1.022-.132-1.173-.629-.151-.497.132-1.022.629-1.173 4.465-1.356 10.021-.703 13.78 1.612.446.274.588.86.314 1.306zm.135-3.415c-3.959-2.351-10.485-2.568-14.281-1.413-.608.185-1.246-.164-1.431-.772-.185-.608.164-1.246.772-1.431 4.354-1.321 11.554-1.066 16.111 1.639.547.325.727 1.034.402 1.581-.325.547-1.034.727-1.573.401z"/>
          </svg>
          Iniciar Sesión con Spotify
        </button>
        <div class="dev-credits">Desarrollado por <a href="https://github.com/yastinvasquezzz" target="_blank">Yastin Vasquez</a></div>
      </div>
    </div>
  </div>

  <!-- Canvas Oculto para Extracción Dinámica de Color -->
  <canvas id="color-canvas" width="32" height="32" style="display:none;"></canvas>

  <script src="renderer.js"></script>
</body>
</html>
